[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

# Placeholder program IDs (valid Base58). `anchor keys sync` / deploy.sh
# overwrite these with the real deployed keypair addresses.
[programs.devnet]
marketplace_program = "DYkZ2FuGnT6aU1Kww56sLRRvppyAf4Hfk6VoBLwjbpMk"
escrow_program = "HKuqJjVmWWJZKxAib8EdB88CgbQkQN6Pn14mTsYycUKi"
rewards_program = "E2Th7noUTVQFxg2s3B4KTEdfu5pyRdKu7TJhquTxW8bh"
cashback_program = "CHmLx6D4XB2GUSLfGv1xquZUfGQv9S5y32sKhBGzJpiC"
nft_program = "2onF96i7PpyYGXsPsEEEgrmR2Xh17HWesYwJynYd13YT"
royalty_program = "Frb2vEYpMt5QeLxQTMW1Yv2qfTXPAqfMJPCYHwCX8yEN"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Clone the Metaplex Token Metadata program into the local validator so the
# on-chain mint (nft_program → Token Metadata CPI) works under `anchor test`.
[test]
startup_wait = 20000

[test.validator]
url = "https://api.mainnet-beta.solana.com"

[[test.validator.clone]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
