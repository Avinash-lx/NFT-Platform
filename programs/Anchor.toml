[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
marketplace_program = "MKT1111111111111111111111111111111111111111"
escrow_program = "ESC1111111111111111111111111111111111111111"
rewards_program = "RWD1111111111111111111111111111111111111111"
cashback_program = "CSH1111111111111111111111111111111111111111"
nft_program = "NFT1111111111111111111111111111111111111111"
royalty_program = "ROY1111111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Clone the Metaplex Token Metadata program into the local validator so the
# on-chain mint (nft_program → Token Metadata CPI) works under `anchor test`.
[test]
startup_wait = 20000

[test.validator]
url = "https://api.mainnet-beta.solana.com"

[[test.validator.clone]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
